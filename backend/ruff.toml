# Ruff — линтер и форматтер Python (dev-quality-gates: Python).
# Правила включаются постепенно: сначала E/W/F/I (ошибки, формат, импорт-гигиена),
# затем UP/B/C4/SIM. На 2026-11-03 весь backend проходит включённые наборы.

line-length = 120
target-version = "py312"

[format]
quote-style = "double"
indent-style = "space"

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM"]
ignore = []

[lint.flake8-bugbear]
# Идиоматичные значения по умолчанию FastAPI — не «вызов в дефолте» в смысле B008.
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Form", "fastapi.Depends"]

[lint.per-file-ignores]
# Alembic-шаблон и среды миграций: метаданные/пути задаются до импортов — норма alembic.
"alembic/**/*.py" = ["E402"]
# Конфесты pytest: sys.path/runtime-подгонки до импорта app — намеренно.
"tests/conftest.py" = ["E402"]
"tests/custom_simulator.py" = ["E402"]
