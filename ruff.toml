# Ruff для файлов вне backend — сейчас это scripts/**/*.py.
# Ближайшего конфига у scripts не было, и ruff брал дефолты (line-length 88,
# только E/F), хотя hk проверяет backend и scripts одним шагом. Корневой
# конфиг наследует проектные правила из backend/ruff.toml, а не копирует их:
# правила остаются в одном месте. Backend при этом продолжает использовать
# свой конфиг — он ближе к файлам.
extend = "backend/ruff.toml"
