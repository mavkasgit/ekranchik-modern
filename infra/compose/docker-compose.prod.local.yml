# Локальный запуск прода на Windows (Docker Desktop).
#
# Прод-сервер — Linux: там сетевой диск уже смонтирован в /mnt/ktm-disk
# скриптом infra/mount_and_start.sh, и compose просто bind-mount'ает его.
# На Windows bind-mount сетевого диска невозможен, а отдельный контейнер
# с mount не подойдёт: mount остаётся в его namespace и бэкенд его не видит.
# Поэтому здесь бэкенд монтирует CIFS сам при старте.
#
# Запуск:
#   docker compose -f infra/compose/docker-compose.prod.yml \
#                  -f infra/compose/docker-compose.prod.local.yml up -d --build
#
# На сервер этот файл не подключается: там остаётся чистый docker-compose.prod.yml.

services:
  backend:
    # mount(2) для CIFS требует CAP_SYS_ADMIN.
    cap_add:
      - SYS_ADMIN

    # Список томов переопределён целиком: точка монтирования книги уехала
    # внутрь контейнера (CIFS), но остальные тома обязаны остаться — в том
    # числе журнал подвесов. Без него /app/journal жил бы внутри контейнера
    # и пропал бы при пересоздании, а на заводском Linux-сервере он монтируется.
    volumes: !override
      - ../../static:/app/static
      - ../../testdata:/app/testdata
      - ../../journal:/app/journal

    # cifs-utils не ставится: его mount.cifs — отдельная программа, которая
    # в контейнере падает с «Unable to apply new capability set». Ядро
    # монтирует CIFS и без неё, в образе python:3.12-slim она не нужна.
    entrypoint:
      - /bin/sh
      - -c
    # Один элемент списка: иначе compose разобьёт строку по пробелам
    # и `sh -c` получит только первое слово.
    command:
      - >-
        mkdir -p /app/excel &&
        mount -t cifs "//172.17.11.7/Оператор" /app/excel
        -o guest,ro,iocharset=utf8,file_mode=0444,dir_mode=0555 &&
        echo "smb://172.17.11.7/Оператор -> /app/excel" &&
        test -n "$$(ls -A /app/excel)" &&
        echo "[start] /app/excel примонтирован" &&
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
