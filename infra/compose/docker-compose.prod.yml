name: ekranchik-prod

networks:
  ekranchik-prod-network:
    driver: bridge
  shared_gateway:
    external: true

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: ekranchik-backend-prod
    env_file:
      - ../../backend/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/static/ekranchik.db
      - STATIC_DIR=/app/static
      # Журнал подвесов лежит ОТДЕЛЬНО от /app/static: /static раздаётся
      # nginx наружу, а журнал — внутренний разбор проходов. Свой том нужен
      # ещё и потому, что пересоздание контейнера иначе унесёт файл.
      - JOURNAL_DIR=/app/journal
      - IMAGES_DIR=/app/static/images
      - ENVIRONMENT=production
      - DEBUG=false
      - SIMULATION_ENABLED=false
      # Путь к книге учёта внутри контейнера, где сетевой диск смонтирован
      # в рабочий каталог. Перекрывает EXCEL_REAL_FILE_PATH из env_file:
      # в .env лежит UNC-путь для dev-хоста, который в контейнере не разрешается.
      - EXCEL_REAL_FILE_PATH=/app/excel/Учет КПЗ 2026.xlsm
      # Свой файл выбора книги: static — общий каталог репозитория, и с
      # одним именем контейнер и dev-бэкенд переписывают выбор друг друга
      # (путь `/app/excel/…` в контейнере против UNC-пути на dev-хосте).
      - EXCEL_ACTIVE_FILE_NAME=active_excel_prod.json
      - TZ=Europe/Moscow
    # Пустой /app/excel = bind-mount сетевого диска не смонтирован: Docker сам
    # создаёт каталог-источник, и бэкенд стартовал бы с пустым каталогом книги
    # («Файл не найден» при живой книге). Проверка стоит до alembic/uvicorn, и
    # при пустом каталоге контейнер завершается с кодом 1 — вместо тихой
    # пустоты. Диск, поднятый после старта, лечится следующим перезапуском
    # (`restart: always`).
    command:
      - /bin/sh
      - -c
      - >-
        test -n "$$(ls -A /app/excel 2>/dev/null)" ||
        { echo "[start] /app/excel пуст: сетевой диск не смонтирован." >&2;
        echo "[start] Linux: infra/mount_and_start.sh; Windows: infra/compose/docker-compose.prod.local.yml." >&2;
        exit 1; };
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    volumes:
      - ../../static:/app/static
      - ../../testdata:/app/testdata
      - ../../journal:/app/journal
      - /mnt/ktm-disk:/app/excel:ro
    networks:
      - ekranchik-prod-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      # Кроме /health проверяется диск: если шара отвалится на ходу, контейнер
      # станет unhealthy — это видно в `docker ps` и в deploy_prod.sh.
      test:
        - CMD-SHELL
        - >-
          curl -f http://localhost:8000/health > /dev/null &&
          test -n "$$(ls -A /app/excel 2>/dev/null)" || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: ekranchik-frontend-prod
    expose:
      - "5173"
    depends_on:
      - backend
    networks:
      - ekranchik-prod-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: ekranchik-nginx-prod
    ports:
      - "${PORT:-8083}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ekranchik-prod-network
      - shared_gateway
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
