<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Одна светлая тема. color-scheme сообщает браузеру схему для фона,
         скроллбаров и нативных контролов ещё до загрузки CSS: без него
         элемент успевает отрисоваться тёмным. -->
    <meta name="color-scheme" content="light" />
    <!-- ?v=2: браузер кэширует значок по URL и держит прежний вариант неделями,
         поэтому смена цвета в favicon.svg сама по себе никому не видна. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ekranchik - Учет КПЗ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
