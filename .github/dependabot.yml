# Обновления зависимостей — Dependabot (выбор при adopt dev-quality-gates, 2026-11-03).
# «Кулдаун» в стиле Renovate здесь = недельный интервал + группы: пулы приходят
# пачками раз в неделю, а не на каждый пакет.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
