# Именной workflow: главный гейт — `npm run gate` (тот же вход, что локально):
# статика hk + pytest + vitest + vite build одним вызовом. OSV-скан — по
# расписанию, отдельным неблокирующим джобом.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # OSV-Scanner: понедельник, см. job osv-scan

permissions: {}

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: quality gates (npm run gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # commitlint читает диапазон коммитов, reactuse-diff — origin/main
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
      - name: project dependencies
        run: mise run install
      - name: commitlint
        env:
          # Бейзлайн: история до внедрения гейта (2026-11-03) не переписана,
          # поэтому push в main проверяет только последний коммит. PR — весь
          # диапазон base..head: ветка от текущего main уже конвенциональна.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            npx --no-install commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          else
            npx --no-install commitlint --last --verbose
          fi
      - name: gate
        run: npm run gate

  osv-scan:
    name: scheduled dependency scan (non-blocking, baseline 2026-11-03)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
      - name: osv-scanner
        run: |
          mkdir -p reports
          osv-scanner scan source -f markdown \
            package-lock.json frontend/package-lock.json backend/requirements.txt \
            > reports/osv-scan.md || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: osv-scan
          path: reports/osv-scan.md
