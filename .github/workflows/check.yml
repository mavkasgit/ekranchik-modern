# Именной workflow: главный гейт dev-quality-gates — агрегатная проверка hk
# (mise run check) + тесты. Дешёвый джоб падает раньше дорогих зависимостей.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # OSV-Scanner: понедельник, см. job osv-scan

permissions: {}

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: quality gates (hk check --all)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # commitlint читает диапазон коммитов
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
      - name: project dependencies
        run: mise run install
      - name: commitlint
        env:
          # Бейзлайн: история до внедрения гейта (2026-11-03) не переписана,
          # поэтому push в main проверяет только последний коммит. PR — весь
          # диапазон base..head: ветка от текущего main уже конвенциональна.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            npx --no-install commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          else
            npx --no-install commitlint --last --verbose
          fi
      - name: aggregate check
        run: mise run check

  tests:
    name: backend pytest + frontend vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
      - name: project dependencies
        run: mise run install
      - name: backend + frontend tests
        run: mise run test
      - name: frontend build
        run: mise run build

  osv-scan:
    name: scheduled dependency scan (non-blocking, baseline 2026-11-03)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
      - name: osv-scanner
        run: |
          mkdir -p reports
          osv-scanner scan source -f markdown \
            package-lock.json frontend/package-lock.json backend/requirements.txt \
            > reports/osv-scan.md || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: osv-scan
          path: reports/osv-scan.md
